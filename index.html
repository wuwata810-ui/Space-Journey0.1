<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#050a1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#e6ecff}
canvas{position:fixed;inset:0;width:100%;height:100%}
.pnl{background:linear-gradient(#d6dbe3,#a9b1bf);border:2px solid #7d8696;border-radius:6px;box-shadow:0 0 0 2px #000a,inset 0 0 0 1px #fffa;color:#2b3345}

#tbtn .ib{width:36px;height:32px;line-height:28px;font-size:17px}

#top .r{display:flex;align-items:center;justify-content:space-between;gap:6px}
#top b{font-weight:600;letter-spacing:.5px}
.ib{background:#e7eaf0;border:2px solid #6c7588;border-radius:4px;width:26px;height:22px;line-height:18px;text-align:center;cursor:pointer;font-size:13px;color:#2b3345}
#hb{height:8px;background:#2a3040;border:1px solid #556;margin:5px 0 3px;border-radius:2px;overflow:hidden}
#hf{height:100%;width:100%;background:linear-gradient(#7dffb0,#2bc47a)}
#inv{font-size:12px;display:flex;justify-content:space-between}
#bdash{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:64px;height:64px;border-radius:50%;border:2px solid #7dff9a;background:#0b1a1fcc;color:#7dff9a;font-size:22px;line-height:1.05;padding:0;z-index:30;touch-action:none;opacity:.85}#bdash span{font-size:10px}#bdash:active{background:#7dff9a55}#bdash.cd{opacity:.9;border-color:#2c5a4a}#bdash.cd::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#0b1a1f;z-index:-1}#bdash.cd{color:#7dff9a99}#bdash.rd{animation:dshp .35s ease-out}@keyframes dshp{0%{transform:scale(1.25);box-shadow:0 0 18px #7dff9a}100%{transform:scale(1)}}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;width:min(480px,96vw);box-sizing:border-box}
#bar button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;flex:1;background:#2a3246;color:#dfe8ff;border:2px solid #56627f;border-radius:5px;padding:6px 2px;font-size:11px;font-family:inherit;cursor:pointer;line-height:1.3}
#bar button i{font-style:normal;font-size:20px;display:block}
#bar button.ok{border-color:#5dffa0;background:#17402c;box-shadow:0 0 8px #5dffa088}
#hint{position:fixed;bottom:110px;left:0;right:0;text-align:center;font-size:13px;color:#9fb0d8;pointer-events:none;transition:opacity 1s}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000b;gap:10px;z-index:5}
.ov.on{display:flex}
#set{width:min(400px,92vw);padding:12px;max-height:84vh;overflow:auto}
#set h3{margin:0 0 8px;text-align:center}
.row{margin:8px 0}.row label{display:block;font-size:13px;margin-bottom:3px}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 2px;border:2px solid #6c7588;background:#e7eaf0;border-radius:4px;font-family:inherit;font-size:12px;color:#2b3345;cursor:pointer}
.seg button.on{background:#2b3a5e;color:#fff;border-color:#2b3a5e}
.row input{width:100%}
.btn{font-size:16px;padding:9px 22px;border-radius:6px;border:2px solid #1c5;background:#5dffa0;color:#052;font-family:inherit;cursor:pointer}
.lb{width:34px;height:34px;border-radius:6px;border:2px solid #56627f;background:#2a3246;color:#dfe8ff;font-weight:700;cursor:pointer}.lb.ok{background:#17402c;border-color:#5dffa0}.lb:disabled{opacity:.35;cursor:default}

#menu{background:#0b0f2e;direction:ltr;flex-direction:row;gap:0;justify-content:space-between;padding:0 3vw;overflow:hidden}
#menu .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,4vh,34px);z-index:1}
#menu .ttl{font-size:clamp(14px,2.2vw,22px);color:#9fb0d8;letter-spacing:1px;direction:rtl}
.px{background:none;border:0;cursor:pointer;font-family:"Press Start 2P","Courier New",monospace;font-weight:900;color:#fff;-webkit-text-stroke:var(--w,14px) var(--c);paint-order:stroke fill;text-shadow:0 var(--s,6px) 0 var(--d);line-height:1.1;padding:6px 14px;transition:transform .12s steps(2)}
@media (hover:hover){.px:hover,.px:focus-visible{transform:scale(1.08) rotate(-1.5deg);outline:none}}
.px{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.px:active{transform:scale(.96)}
.px.play{font-size:clamp(46px,9vw,92px);--c:#2fc7f7;--d:#1a7fa8}
.px.exit{font-size:clamp(34px,6.5vw,66px);--c:#e33a3f;--d:#8e1d26}
.px.sm{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:clamp(20px,3vw,28px);--w:9px;--s:4px;--c:#7a4fd6;--d:#43268a}
.px.sm.gold{--c:#e0a81c;--d:#8a6209}
#menu .row2{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
#mc{color:#9fb0d8;font-size:15px;direction:rtl}
#menu .scene{flex:1.35;height:100%;display:flex;align-items:center}
#menu svg{width:100%;height:auto;max-height:100%;shape-rendering:crispEdges}
.bob{animation:bob 2.4s steps(4) infinite alternate}
.fl{animation:fl .3s steps(2) infinite}
.tw{animation:tw 2.2s steps(2) infinite}
.dr{animation:dr 9s linear infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes fl{50%{opacity:.35}}
@keyframes tw{50%{opacity:.25}}
@keyframes dr{to{transform:translateX(8px)}}
@media (max-width:760px) and (orientation:portrait){body:not(.rot) #menu{flex-direction:column-reverse;padding:0 4vw}body:not(.rot) #menu .scene{flex:0 0 38%;width:100%}body:not(.rot) #menu .col{flex:1;gap:12px}}
body.rot #set{max-height:88%}body.rot #top{width:min(430px,60%)}body.rot #bar{width:min(430px,60%)}
@media (max-height:500px){#menu .col{gap:6px}#menu .row2{gap:6px}#menu .px.play{font-size:clamp(40px,7vw,58px)}#menu .px.exit{font-size:clamp(30px,5vw,42px)}#menu .px.sm{font-size:clamp(15px,2vw,18px);--w:6px;--s:3px}}
body.rot #menu .col{gap:6px}body.rot #menu .row2{gap:6px}body.rot #menu .px.play{font-size:50px}body.rot #menu .px.exit{font-size:38px}body.rot #menu .px.sm{font-size:16px;--w:6px;--s:3px}
@media (prefers-reduced-motion:reduce){.bob,.fl,.tw,.dr{animation:none}}

#dfo{background:#0b0f2e;direction:rtl;gap:16px;padding:12px;overflow:auto}
#dfo .dl{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw)}
#dfo .dl button{font-size:22px;padding:14px 18px;border-radius:12px}
#dfo .dl button.cur{border-color:#b5d93d;color:#b5d93d}
#dfo .dl button small{display:block;font-size:12px;font-weight:400;opacity:.75;margin-top:2px}
#wmap{background:#0b0f2e;direction:ltr;justify-content:space-between;gap:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);overflow:hidden}
.mt{font-family:"Press Start 2P","Courier New",monospace;font-weight:900;color:#fff;-webkit-text-stroke:9px #1b1f3a;paint-order:stroke fill;text-align:center;line-height:1.15;margin:0}
.mt.w{font-size:clamp(28px,6vw,56px)}.mt.l{font-size:clamp(20px,3.6vw,36px);color:#b5d93d;margin-top:6px}
#wmap svg{flex:1;min-height:0;width:100%;max-width:1100px}
#wmap svg text{font-family:"Press Start 2P","Courier New",monospace;font-weight:900;fill:#fff;stroke:#1b1f3a;stroke-width:7px;paint-order:stroke fill;text-anchor:middle;pointer-events:none}
#wmap .wl{color:#e6ecff;font-weight:700;font-size:17px;margin-bottom:8px;text-shadow:0 2px 0 #000}
#wmap .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:100%}
.mb{background:#161b45;color:#e6ecff;border:2px solid #3a4180;border-radius:10px;padding:10px 16px;font:700 15px system-ui,"Segoe UI",Tahoma,sans-serif;cursor:pointer}
.mb:hover:not(:disabled),.mb:focus-visible{border-color:#5cf0ff;outline:none}

.mb.go{background:#b5d93d;color:#1b2a05;border-color:#1b1f3a}

#shp{background:#0b0f2e;direction:ltr;justify-content:flex-start;gap:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 16px;overflow-y:auto;overflow-x:hidden}

#igs{overflow:auto;z-index:12;background:#000d;justify-content:flex-start;padding:12px;box-sizing:border-box}#shp .in,#igs .in{position:relative;z-index:1;width:min(1000px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;width:100%;direction:rtl}
.sc{background:#121740e8;border:2px solid #3a4180;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:center}

.stat{display:flex;align-items:center;gap:6px;font-size:13px;color:#cfd8ff}
.mtr{flex:1;height:8px;background:#2a3040;border:1px solid #556;border-radius:2px;overflow:hidden}.mtr i{display:block;height:100%}

.kb{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.kbr{margin-top:6px;width:100%;padding:5px;border:2px solid #6c7588;background:#e7eaf0;border-radius:4px;font-family:inherit;font-size:12px;color:#2b3345;cursor:pointer}
body.mob #top{width:min(250px,50%);padding:2px 6px 3px;font-size:10px;top:calc(env(safe-area-inset-top,0px) + 3px)}

#edt{position:fixed;inset:0;z-index:9;display:none}body.ed #edt{display:block}body.ed .ov{display:none!important}
.eb{position:absolute;border:2px dashed #b5d93d;box-sizing:border-box;cursor:move;touch-action:none;background:#b5d93d18}.eb.off{border-color:#ff7a7a;background:#ff7a7a14}

#edb{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);padding:10px 14px;text-align:center;max-width:min(380px,80%)}#edb .et{font-weight:700;font-size:15px;margin-bottom:4px}#edb .ei{font-size:11px;line-height:1.6;margin-bottom:8px;opacity:.85}#edb .er{display:flex;gap:8px;justify-content:center}

 radial-gradient(1.6px 1.6px at 30px 50px,#fff,transparent 60%),
